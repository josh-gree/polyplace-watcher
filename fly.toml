# fly.toml app configuration file generated for polyplace-watcher on 2026-04-17T17:57:06+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'polyplace-watcher'
primary_region = 'lhr'

[build]

[env]
  # Snapshot file is per-deployment: the 2026-04-29 Amoy beta (grid
  # 0x16b6...2e48). A GRID_ADDRESS change must come with a fresh snapshot
  # path — the app re-saves in-memory state on shutdown, so reusing the old
  # path would resurrect cells indexed from the previous contract.
  SNAPSHOT_PATH = '/data/snapshot-amoy-0x16b6.json'
  CORS_ORIGINS = 'https://polyplace-frontend.joshuadouglasgreenhalgh.workers.dev'

[mounts]
  source = 'watcher_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
